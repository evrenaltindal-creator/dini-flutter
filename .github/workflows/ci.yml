name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Flutter quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Check formatting
        run: |
          dart format .
          git diff --exit-code

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

  ios-unsigned:
    name: iOS release build (unsigned)
    needs: quality
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Verify CocoaPods availability
        run: pod --version

      - name: Build unsigned iOS release
        run: >-
          flutter build ios
          --release
          --no-codesign
          --build-name=1.0.0
          --build-number="${GITHUB_RUN_NUMBER}"

      - name: Verify embedded WidgetKit extension
        run: test -d build/ios/iphoneos/Runner.app/PlugIns/DiniWidgetExtension.appex
